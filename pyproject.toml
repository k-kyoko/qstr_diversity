[project]
name = "qstr-diversity"
version = "0.1.0"
description = "Diversity indices (magnitude, generalized magnitude, spread) for similarity-rating experiment data"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kyoko Kusano" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "adjusttext>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qstr_diversity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
